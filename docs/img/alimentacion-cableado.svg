 cy="302" r="6"/><line class="ls" x1="534" y1="302" x2="542" y2="302"/><text class="ts tc" x="525" y="284">C3 · GND</text><line class="srojo" x1="136" y1="60" x2="160" y2="60"/><rect class="caja" x="160" y="52" width="40" height="16" rx="8"/><text class="ts tc" x="180" y="64">5 A</text><polyline class="srojo" points="200.0,60.0 300.0,60.0 300.0,172.0 382.0,172.0"/><line class="srojo" x1="136" y1="250" x2="160" y2="250"/><rect class="caja" x="160" y="242" width="40" height="16" rx="8"/><text class="ts tc" x="180" y="254">5 A</text><polyline class="srojo" points="200.0,250.0 290.0,250.0 290.0,172.0 382.0,172.0"/><text class="ts" x="150" y="26">portafusibles a &lt;10 cm del borne</text><text class="ts" x="10" y="222">faston en los bornes</text><polyline class="l" points="136.0,100.0 235.0,100.0 235.0,302.0 500.0,302.0"/><polyline class="l" points="136.0,290.0 220.0,290.0 220.0,302.0 500.0,302.0"/><circle class="caja" cx="400" cy="172" r="18"/><circle class="caja" cx="400" cy="172" r="9"/><circle style="fill:var(--tinta,#1d1d1b)" cx="382" cy="172" r="3"/><circle style="fill:var(--tinta,#1d1d1b)" cx="418" cy="172" r="3"/><text class="ts tc" x="400" y="210">interruptor</text><text class="ts tc" x="400" y="224">(debajo del mueble)</text><text class="ts tc" x="400" y="242">los dos + en la misma borna</text><polyline class="srojo" points="418.0,172.0 450.0,172.0 450.0,80.0 500.0,80.0"/><polyline class="srojo" points="500.0,80.0 480.0,80.0 480.0,140.0 500.0,140.0"/><text class="ts" x="486" y="168">puente</text><rect class="caja" x="640" y="40" width="115" height="56" rx="6"/><text class="t tc tb" x="697.5" y="64.5">Gledopto</text><text class="ts tc" x="697.5" y="79.5">entrada 12 V</text><rect class="caja" x="640" y="150" width="115" height="56" rx="6"/><text class="t tc tb" x="697.5" y="174.5">Buck HW-319</text><text class="ts tc" x="697.5" y="189.5">IN+ · IN−</text><rect class="caja" x="640" y="260" width="115" height="56" rx="6"/><text class="t tc tb" x="697.5" y="284.5">Interfaz</text><text class="ts tc" x="697.5" y="299.5">divisor de batería</text><polyline class="srojo" points="550.0,80.0 600.0,80.0 600.0,56.0 640.0,56.0"/><polyline class="srojo" points="550.0,80.0 580.0,80.0 580.0,166.0 640.0,166.0"/><polyline class="s2" points="550.0,140.0 565.0,140.0 565.0,276.0 640.0,276.0"/><polyline class="l" points="550.0,302.0 620.0,302.0 620.0,84.0 640.0,84.0"/><polyline class="l" points="550.0,302.0 605.0,302.0 605.0,190.0 640.0,190.0"/><text class="ts" x="10" y="362">Rojo: positivo (1 mm²). Negro: GND (1 mm²). Ámbar: 12 V al divisor (hilo fino). Como máximo dos cables por tornillo.</text><text class="ts" x="10" y="378">C2 queda con un lado libre para el medidor de potencia o ampliaciones. Los cables de las dos baterías, con la misma longitud.</text></svg>
