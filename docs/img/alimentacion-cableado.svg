<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-label="Cableado de la alimentación con la regleta"><title>Cableado de la alimentación con la regleta</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
