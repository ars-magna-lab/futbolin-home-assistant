<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Cableado definitivo del futbolín"><title>Cableado definitivo del futbolín</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
.ls{stroke:var(--suave,#6b6a65);stroke-width:1;fill:none}
.lg{stroke:var(--linea,#e3e1db);stroke-width:1;fill:none}
.caja{fill:var(--papel,#fff);stroke:var(--suave,#6b6a65);stroke-width:1.2}
.zona{fill:var(--chip,#efede8);stroke:var(--linea,#e3e1db)}
.punteada{stroke-dasharray:5 4}
.madera{fill:var(--madera,#c9a77c);stroke:var(--madera-borde,#9c7a50)}
.bola{fill:var(--bola,#ecebe6);stroke:var(--tinta,#1d1d1b);stroke-width:1.5}
.rojo{fill:var(--rojo,#c0392b)}
.srojo{stroke:var(--rojo,#c0392b);stroke-width:2;fill:none}
.s1{stroke:var(--serie1,#2563a8);stroke-width:2;fill:none}
.f1{fill:var(--serie1,#2563a8)}
.s2{stroke:var(--serie2,#b8860b);stroke-width:2;fill:none}
.f2{fill:var(--serie2,#b8860b)}
.sombra1{fill:var(--serie1,#2563a8);opacity:.12}
.sombra2{fill:var(--serie2,#b8860b);opacity:.15}
.sombrar{fill:var(--rojo,#c0392b);opacity:.12}
</style><defs><marker id="fl-cableado-general" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><rect class="zona" x="380" y="128" width="375" height="270" rx="8"/><text class="ts" x="525" y="146">Panel de electrónica (contrachapado)</text><rect class="caja" x="10" y="30" width="110" height="48" rx="6"/><text class="t tc tb" x="65.0" y="50.5">Batería 1</text><text class="ts tc" x="65.0" y="65.5">plomo 12 V 7 Ah</text><line class="srojo" x1="120" y1="44" x2="150" y2="44"/><rect class="caja" x="150" y="30" width="84" height="30" rx="6"/><text class="t tc tb" x="192.0" y="49.0">Fusible 5 A</text><line class="l" x1="120" y1="68" x2="135" y2="68"/><polyline class="srojo" points="234,45 300,45 300,92 360,92"/><rect class="caja" x="10" y="110" width="110" height="48" rx="6"/><text class="t tc tb" x="65.0" y="130.5">Batería 2</text><text class="ts tc" x="65.0" y="145.5">plomo 12 V 7 Ah</text><line class="srojo" x1="120" y1="124" x2="150" y2="124"/><rect class="caja" x="150" y="110" width="84" height="30" rx="6"/><text class="t tc tb" x="192.0" y="129.0">Fusible 5 A</text><line class="l" x1="120" y1="148" x2="135" y2="148"/><polyline class="srojo" points="234,125 300,125 300,92 360,92"/><text class="ts" x="150" y="174">faston · fusible a &lt;10 cm del borne</text><text class="ts" x="150" y="155">los dos + a la misma borna</text><rect class="caja" x="360" y="70" width="100" height="44" rx="6"/><text class="t tc tb" x="410.0" y="88.5">Interruptor</text><text class="ts tc" x="410.0" y="103.5">bajo el mueble</text><line class="srojo" x1="410" y1="114" x2="410" y2="160"/><rect class="caja" x="400" y="160" width="120" height="54" rx="6"/><text class="t tc tb" x="460.0" y="183.5">Bus 12 V</text><text class="ts tc" x="460.0" y="198.5">regleta de 3 clemas</text><polyline class="l" points="135,68 135,252 430,252 430,214"/><text class="ts" x="145" y="246">GND de las baterías (1 mm²)</text><polyline class="srojo" points="500,160 500,48 600,48"/><rect class="caja" x="600" y="20" width="150" height="56" rx="6"/><text class="t tc tb" x="675.0" y="44.5">Gledopto · WLED</text><text class="ts tc" x="675.0" y="59.5">par 1 mm² · tiras a G D V</text><text class="ts" x="508" y="40">par 1 mm²</text><line class="srojo" x1="520" y1="182" x2="620" y2="182"/><rect class="caja" x="620" y="160" width="130" height="44" rx="6"/><text class="t tc tb" x="685.0" y="178.5">Buck 12→5 V</text><text class="ts tc" x="685.0" y="193.5">HW-319 a 5,0 V</text><line class="s2" x1="490" y1="214" x2="490" y2="280"/><text class="ts" x="496" y="240">12 V al divisor</text><line class="l" x1="685" y1="204" x2="685" y2="280"/><text class="ts" x="692" y="246">5 V y GND</text><rect class="caja" x="395" y="280" width="200" height="100" rx="6"/><text class="t tc tb" x="495.0" y="311.5">Interfaz</text><text class="ts tc" x="495.0" y="326.5">pull-up y 1 kΩ soldadas al cable</text><text class="ts tc" x="495.0" y="341.5">divisor 100k / 20k en línea</text><text class="ts tc" x="495.0" y="356.5">3 clemas: 3,3 V y GND</text><rect class="caja" x="620" y="280" width="130" height="100" rx="6"/><text class="t tc tb" x="685.0" y="319.0">ESP32 DevKit</text><text class="ts tc" x="685.0" y="334.0">placa de bornas</text><text class="ts tc" x="685.0" y="349.0">antena hacia fuera</text><line class="l" x1="595" y1="330" x2="620" y2="330"/><text class="ts tc" x="607" y="322">7</text><line class="s1" x1="210" y1="320" x2="395" y2="320"/><rect class="caja" x="214" y="312" width="22" height="16" rx="2"/><rect class="caja" x="10" y="300" width="200" height="40" rx="6"/><text class="t tc tb" x="110.0" y="316.5">Carril A · Real Madrid</text><text class="ts tc" x="110.0" y="331.5">receptor + emisor</text><line class="s2" x1="210" y1="370" x2="395" y2="370"/><rect class="caja" x="214" y="362" width="22" height="16" rx="2"/><rect class="caja" x="10" y="350" width="200" height="40" rx="6"/><text class="t tc tb" x="110.0" y="366.5">Carril B · Barcelona</text><text class="ts tc" x="110.0" y="381.5">receptor + emisor</text><text class="ts" x="214" y="300">cable de 5 hilos, uno por carril</text><text class="ts" x="214" y="406">↑ 2 × JST-SM junto al carril</text><text class="ts" x="10" y="430">Rojo: +12 V. Los cables de señal van separados ≥ 5 cm de los de 12 V; si se cruzan, en ángulo recto.</text></svg>
