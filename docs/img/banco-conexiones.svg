<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="Banco de pruebas: conexiones en la protoboard"><title>Banco de pruebas: conexiones en la protoboard</title><style>
