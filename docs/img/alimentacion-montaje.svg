<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-label="Dónde va cada cosa: baterías y panel de electrónica"><title>Dónde va cada cosa: baterías y panel de electrónica</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
.ls{stroke:var(--suave,#6b6a65);stroke-width:1;fill:none}
.lg{stroke:var(--linea,#e3e1db);stroke-width:1;fill:none}
.caja{fill:var(--papel,#fff);stroke:var(--suave,#6b6a65);stroke-width:1.2}
.zona{fill:var(--chip,#efede8);stroke:var(--linea,#e3e1db)}
.punteada{stroke-dasharray:5 4}
.madera{fill:var(--madera,#c9a77c);stroke:var(--madera-borde,#9c7a50)}
.bola{fill:var(--bola,#ecebe6);stroke:var(--tinta,#1d1d1b);stroke-width:1.5}
.rojo{fill:var(--rojo,#c0392b)}
.srojo{stroke:var(--rojo,#c0392b);stroke-width:2;fill:none}
.s1{stroke:var(--serie1,#2563a8);stroke-width:2;fill:none}
.f1{fill:var(--serie1,#2563a8)}
.s2{stroke:var(--serie2,#b8860b);stroke-width:2;fill:none}
.f2{fill:var(--serie2,#b8860b)}
.sombra1{fill:var(--serie1,#2563a8);opacity:.12}
.sombra2{fill:var(--serie2,#b8860b);opacity:.15}
.sombrar{fill:var(--rojo,#c0392b);opacity:.12}
</style><defs><marker id="fl-alimentacion-montaje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><text class="t tb" x="10" y="22">Vista desde arriba, con el tablero abierto</text><rect class="madera" x="20" y="44" width="186" height="10"/><text class="ts" x="20" y="38">listón de tope</text><rect class="caja" x="24" y="56" width="78" height="181" rx="3"/><text class="t tb tc" x="63" y="160">Bat. 1</text><rect class="rojo" x="76" y="64" width="12" height="8"/><rect x="38" y="64" width="12" height="8" style="fill:var(--tinta,#1d1d1b)"/><rect class="caja" x="112" y="56" width="78" height="181" rx="3"/><text class="t tb tc" x="151" y="160">Bat. 2</text><rect class="rojo" x="164" y="64" width="12" height="8"/><rect x="126" y="64" width="12" height="8" style="fill:var(--tinta,#1d1d1b)"/><text class="ts tc" x="113" y="256">151 × 65 mm cada una, de pie</text><rect x="16" y="190" width="190" height="10" class="sombra2"/><text class="ts" x="20" y="274">franja ámbar: correa de velcro</text><rect class="madera" x="246" y="56" width="300" height="181" rx="3" style="opacity:.55"/><text class="ts" x="420" y="256">panel de contrachapado ~25 × 15 cm</text><line class="ls punteada" x1="396" y1="62" x2="396" y2="232"/><text class="ts tc" x="320" y="76">zona 12 V</text><text class="ts tc" x="470" y="76">zona 5 V / 3,3 V</text><rect class="caja" x="262" y="96" width="108" height="40" rx="3"/><circle class="caja" cx="280" cy="106" r="5"/><circle class="caja" cx="280" cy="126" r="5"/><text class="ts tc" x="280" y="152" style="font-size:10px">C1</text><line class="ls" x1="298" y1="96" x2="298" y2="136"/><circle class="caja" cx="316" cy="106" r="5"/><circle class="caja" cx="316" cy="126" r="5"/><text class="ts tc" x="316" y="152" style="font-size:10px">C2</text><line class="ls" x1="334" y1="96" x2="334" y2="136"/><circle class="caja" cx="352" cy="106" r="5"/><circle class="caja" cx="352" cy="126" r="5"/><text class="ts tc" x="352" y="152" style="font-size:10px">C3</text><text class="ts tc" x="316" y="168">regleta: +12 · +12 · GND</text><rect class="caja" x="258" y="176" width="112" height="46" rx="6"/><text class="t tc tb" x="314.0" y="195.5">Buck</text><text class="ts tc" x="314.0" y="210.5">12 → 5 V</text><rect class="caja" x="406" y="90" width="130" height="56" rx="6"/><text class="t tc" x="471.0" y="114.5">Interfaz</text><text class="ts tc" x="471.0" y="129.5">3 clemas</text><rect class="caja" x="406" y="160" width="130" height="66" rx="6"/><text class="t tc tb" x="471.0" y="189.5">ESP32</text><text class="ts tc" x="471.0" y="204.5">antena → fuera</text><polyline class="srojo" points="82.0,64.0 82.0,48.0 240.0,48.0 240.0,242.0 372.0,242.0 380.0,262.0"/><polyline class="srojo" points="170.0,64.0 170.0,52.0 232.0,52.0 232.0,246.0 370.0,246.0 378.0,262.0"/><text class="ts" x="216" y="300">los + de las baterías, al interruptor;</text><text class="ts" x="216" y="314">su vuelta, a la regleta</text><rect class="caja" x="96" y="42" width="22" height="10" rx="5"/><rect class="caja" x="184" y="46" width="22" height="10" rx="5"/><text class="ts" x="250" y="40">fusibles junto al + de cada batería</text><polyline class="srojo" points="280.0,96.0 280.0,62.0 740.0,62.0"/><text class="ts" x="606" y="54">al Gledopto y las tiras</text><polyline class="s1" points="546.0,120.0 740.0,120.0"/><polyline class="s2" points="546.0,130.0 740.0,130.0"/><text class="ts" x="606" y="150">a los carriles Madrid y Barcelona</text><text class="ts" x="606" y="164">(cables de 5 hilos)</text><circle class="caja punteada" cx="380" cy="318" r="14"/><polyline class="srojo punteada" points="380.0,264.0 380.0,304.0"/><text class="ts" x="402" y="322">interruptor, por debajo del mueble (taladro de 19 mm)</text></svg>
