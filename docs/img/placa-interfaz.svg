<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Interfaz junto al ESP32 y conectores de una barrera"><title>Interfaz junto al ESP32 y conectores de una barrera</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
.ls{stroke:var(--suave,#6b6a65);stroke-width:1;fill:none}
.lg{stroke:var(--linea,#e3e1db);stroke-width:1;fill:none}
.caja{fill:var(--papel,#fff);stroke:var(--suave,#6b6a65);stroke-width:1.2}
.zona{fill:var(--chip,#efede8);stroke:var(--linea,#e3e1db)}
.punteada{stroke-dasharray:5 4}
.madera{fill:var(--madera,#c9a77c);stroke:var(--madera-borde,#9c7a50)}
.bola{fill:var(--bola,#ecebe6);stroke:var(--tinta,#1d1d1b);stroke-width:1.5}
.rojo{fill:var(--rojo,#c0392b)}
.srojo{stroke:var(--rojo,#c0392b);stroke-width:2;fill:none}
.s1{stroke:var(--serie1,#2563a8);stroke-width:2;fill:none}
.f1{fill:var(--serie1,#2563a8)}
.s2{stroke:var(--serie2,#b8860b);stroke-width:2;fill:none}
.f2{fill:var(--serie2,#b8860b)}
.sombra1{fill:var(--serie1,#2563a8);opacity:.12}
.sombra2{fill:var(--serie2,#b8860b);opacity:.15}
.sombrar{fill:var(--rojo,#c0392b);opacity:.12}
</style><defs><marker id="fl-placa-interfaz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><rect class="caja" x="10" y="30" width="110" height="290" rx="6"/><text class="t tc tb" x="65.0" y="179.0">ESP32</text><text class="t te" x="112" y="64">3V3</text><circle style="fill:var(--tinta,#1d1d1b)" cx="120" cy="60" r="3"/><text class="t te" x="112" y="104">GND</text><circle style="fill:var(--tinta,#1d1d1b)" cx="120" cy="100" r="3"/><text class="t te" x="112" y="154">GPIO 32</text><circle style="fill:var(--tinta,#1d1d1b)" cx="120" cy="150" r="3"/><text class="t te" x="112" y="214">GPIO 14</text><circle style="fill:var(--tinta,#1d1d1b)" cx="120" cy="210" r="3"/><text class="t te" x="112" y="294">GPIO 34</text><circle style="fill:var(--tinta,#1d1d1b)" cx="120" cy="290" r="3"/><rect class="zona" x="150" y="20" width="290" height="330" rx="8"/><text class="ts" x="160" y="38">Junto al ESP32: carril A (el B, igual con 33 y 27)</text><line class="l" x1="120" y1="60" x2="540" y2="60"/><line class="l" x1="120" y1="100" x2="540" y2="100"/><rect class="caja" x="180" y="50" width="24" height="20" rx="3"/><circle class="caja" cx="192" cy="60" r="5"/><line class="ls" x1="188" y1="60" x2="196" y2="60"/><text class="ts" x="170" y="84">clema 3,3 V</text><rect class="caja" x="180" y="90" width="24" height="20" rx="3"/><circle class="caja" cx="192" cy="100" r="5"/><line class="ls" x1="188" y1="100" x2="196" y2="100"/><text class="ts" x="170" y="124">clema GND</text><rect class="sombra2" x="240" y="48" width="170" height="114" rx="6"/><text class="ts" x="250" y="176">soldadas en el cable</text><line class="s1" x1="120" y1="150" x2="250" y2="150"/><rect class="caja" x="250" y="143" width="44" height="14"/><text class="ts tc" x="272" y="138">1 kΩ</text><line class="s1" x1="294" y1="150" x2="540" y2="150"/><path class="l" d="M330,60 L330,92 A8,8 0 0 1 330,108 L330,112"/><circle style="fill:var(--tinta,#1d1d1b)" cx="330" cy="60" r="3"/><rect class="caja" x="323" y="112" width="14" height="30"/><text class="ts" x="342" y="132">5,1 kΩ</text><line class="l" x1="330" y1="142" x2="330" y2="150"/><circle style="fill:var(--tinta,#1d1d1b)" cx="330" cy="150" r="3"/><line class="l" x1="120" y1="210" x2="540" y2="210"/><text class="ts" x="160" y="204">emisor, directo a la borna (~10 mA)</text><path class="l" d="M420,100 L420,142 A8,8 0 0 1 420,158 L420,202 A8,8 0 0 1 420,218 L420,250 L540,250"/><circle style="fill:var(--tinta,#1d1d1b)" cx="420" cy="100" r="3"/><line class="s2" x1="120" y1="290" x2="340" y2="290"/><rect class="caja" x="340" y="283" width="50" height="14"/><text class="ts tc" x="365" y="278">100 kΩ</text><line class="s2" x1="390" y1="290" x2="430" y2="290"/><text class="ts" x="372" y="312">← 12 V (C2)</text><line class="l" x1="260" y1="290" x2="260" y2="300"/><circle style="fill:var(--tinta,#1d1d1b)" cx="260" cy="290" r="3"/><rect class="caja" x="253" y="300" width="14" height="22"/><text class="ts" x="196" y="316">22 kΩ</text><line class="l" x1="260" y1="322" x2="260" y2="330"/><line class="l" x1="250" y1="330" x2="270" y2="330"/><line class="l" x1="254" y1="335" x2="266" y2="335"/><text class="t tb tc" x="495" y="38">5 hilos</text><text class="ts tc" x="495" y="54">H1</text><text class="ts tc" x="495" y="94">H2</text><text class="ts tc" x="495" y="144">H3</text><text class="ts tc" x="495" y="204">H4</text><text class="ts tc" x="495" y="244">H5</text><rect class="caja" x="540" y="40" width="210" height="130" rx="6"/><text class="t tb" x="552" y="30">JST receptor</text><circle style="fill:var(--tinta,#1d1d1b)" cx="540" cy="60" r="3"/><text class="t" x="552" y="64">1 · 3,3 V → rojo</text><circle style="fill:var(--tinta,#1d1d1b)" cx="540" cy="100" r="3"/><text class="t" x="552" y="104">2 · GND → negro</text><circle style="fill:var(--tinta,#1d1d1b)" cx="540" cy="150" r="3"/><text class="t" x="552" y="154">3 · señal → blanco</text><rect class="caja" x="540" y="190" width="210" height="110" rx="6"/><text class="t tb" x="552" y="184">JST emisor</text><circle style="fill:var(--tinta,#1d1d1b)" cx="540" cy="210" r="3"/><text class="t" x="552" y="214">1 · emisor → rojo</text><circle style="fill:var(--tinta,#1d1d1b)" cx="540" cy="250" r="3"/><text class="t" x="552" y="254">2 · GND → negro</text><text class="t" x="552" y="289">3 · libre</text><text class="ts" x="10" y="374">GND siempre en el centro del conector. Si se cruzan los dos conectores de un carril no se rompe nada: el autotest falla.</text><text class="ts" x="10" y="390">Resistencias y divisor soldados en el cable, cada empalme con su termorretráctil y uno grueso por encima de todo.</text></svg>
