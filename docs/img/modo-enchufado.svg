<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 182" width="760" height="182" role="img" aria-label="Modo enchufado: la fuente en lugar de las baterías"><title>Modo enchufado: la fuente en lugar de las baterías</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
