<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Dónde iría el piezo: detrás del fondo de la portería"><title>Dónde iría el piezo: detrás del fondo de la portería</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
