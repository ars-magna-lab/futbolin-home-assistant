<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="Detector de pico entre el piezo y el ESP32"><title>Detector de pico entre el piezo y el ESP32</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
