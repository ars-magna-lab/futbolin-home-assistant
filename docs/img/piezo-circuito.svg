="60" x2="520" y2="102"/><line class="l" x1="520" y1="122" x2="520" y2="170"/><polygon style="fill:var(--tinta,#1d1d1b)" points="510,122 530,122 520,104"/><polyline class="l" points="506,100 510,102 530,102 534,104"/><line class="l" x1="500" y1="170" x2="520" y2="170"/><text class="t" x="536" y="119">zener 3,3 V</text><circle style="fill:var(--tinta,#1d1d1b)" cx="360" cy="60" r="3"/><circle style="fill:var(--tinta,#1d1d1b)" cx="450" cy="60" r="3"/><circle style="fill:var(--tinta,#1d1d1b)" cx="520" cy="60" r="3"/><circle style="fill:var(--tinta,#1d1d1b)" cx="120" cy="60" r="3"/><rect class="caja" x="600" y="40" width="140" height="40" rx="6"/><text class="t tc tb" x="670.0" y="56.5">GPIO 35</text><text class="ts tc" x="670.0" y="71.5">ADC1, solo entrada</text><text class="ts tc" x="60" y="214">genera tensión</text><text class="ts tc" x="120" y="230">descarga el piezo</text><text class="ts tc" x="205" y="214">limita corriente</text><text class="ts tc" x="284" y="230">solo deja subir</text><text class="ts tc" x="360" y="214">guarda el pico</text><text class="ts tc" x="450" y="230">lo vacía: τ = 0,1 s</text><text class="ts tc" x="530" y="214">protege el ESP32</text></svg>
