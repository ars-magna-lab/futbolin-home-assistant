</style><defs><marker id="fl-arquitectura" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><rect class="zona" x="10" y="10" width="430" height="340" rx="10"/><text class="t tb" x="26" y="34">Futbolín · a batería, todo oculto</text><rect class="zona" x="500" y="10" width="250" height="340" rx="10"/><text class="t tb" x="516" y="34">Casa</text><rect class="caja" x="30" y="185" width="170" height="40" rx="6"/><text class="t tc tb" x="115.0" y="201.5">Barreras IR</text><text class="ts tc" x="115.0" y="216.5">una por carril</text><line class="l" x1="200" y1="205" x2="248" y2="205" marker-end="url(#fl-arquitectura)" /><rect class="caja" x="250" y="50" width="170" height="50" rx="6"/><text class="t tc tb" x="335.0" y="71.5">Baterías 12 V</text><text class="ts tc" x="335.0" y="86.5">2 × plomo 7 Ah · interruptor</text><line class="l" x1="335" y1="100" x2="335" y2="168" marker-end="url(#fl-arquitectura)" /><text class="ts" x="342" y="138">buck 12→5 V</text><rect class="caja" x="250" y="170" width="170" height="70" rx="6"/><text class="t tc tb" x="335.0" y="194.0">ESP32 · ESPHome</text><text class="ts tc" x="335.0" y="209.0">lleva la partida</text><text class="ts tc" x="335.0" y="224.0">cuenta aunque caiga HA</text><line class="l punteada" x1="335" y1="240" x2="335" y2="278" marker-end="url(#fl-arquitectura)"/><text class="ts" x="342" y="264">presets (WiFi local)</text><rect class="caja" x="250" y="280" width="170" height="44" rx="6"/><text class="t tc tb" x="335.0" y="298.5">Gledopto · WLED</text><text class="ts tc" x="335.0" y="313.5">controlador de tiras</text><line class="l" x1="250" y1="302" x2="202" y2="302" marker-end="url(#fl-arquitectura)" /><rect class="caja" x="30" y="280" width="170" height="44" rx="6"/><text class="t tc tb" x="115.0" y="298.5">Tiras LED</text><text class="ts tc" x="115.0" y="313.5">2 × 28 píxeles, 12 V</text><rect class="caja" x="520" y="60" width="210" height="120" rx="6"/><text class="t tc tb" x="625.0" y="94.0">Home Assistant</text><text class="ts tc" x="625.0" y="109.0">entidades ESPHome y WLED</text><text class="ts tc" x="625.0" y="124.0">dashboard del marcador</text><text class="ts tc" x="625.0" y="139.0">Assist (voz)</text><text class="ts tc" x="625.0" y="154.0">automatizaciones</text><line class="l punteada" x1="422" y1="195" x2="518" y2="140" marker-end="url(#fl-arquitectura)" marker-start="url(#fl-arquitectura)"/><text class="ts tc" x="462" y="152">API ESPHome</text><line class="l punteada" x1="422" y1="295" x2="518" y2="170" marker-end="url(#fl-arquitectura)" marker-start="url(#fl-arquitectura)"/><text class="ts tc" x="488" y="262">WLED</text><text class="t tc tb" x="470" y="345">WiFi</text><line class="l" x1="625" y1="182" x2="625" y2="238" marker-end="url(#fl-arquitectura)" marker-start="url(#fl-arquitectura)"/><rect class="caja" x="520" y="240" width="210" height="70" rx="6"/><text class="t tc tb" x="625.0" y="264.0">Tablet</text><text class="ts tc" x="625.0" y="279.0">marcador en grande</text><text class="ts tc" x="625.0" y="294.0">mando por voz</text></svg>
