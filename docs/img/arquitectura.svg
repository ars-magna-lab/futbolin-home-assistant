<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Arquitectura: futbolín a batería con ESPHome y WLED, controlado desde Home Assistant"><title>Arquitectura: futbolín a batería con ESPHome y WLED, controlado desde Home Assistant</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
