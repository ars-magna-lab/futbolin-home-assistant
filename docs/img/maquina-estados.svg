<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Estados de la partida que lleva el ESP32"><title>Estados de la partida que lleva el ESP32</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
.ls{stroke:var(--suave,#6b6a65);stroke-width:1;fill:none}
.lg{stroke:var(--linea,#e3e1db);stroke-width:1;fill:none}
.caja{fill:var(--papel,#fff);stroke:var(--suave,#6b6a65);stroke-width:1.2}
.zona{fill:var(--chip,#efede8);stroke:var(--linea,#e3e1db)}
.punteada{stroke-dasharray:5 4}
.madera{fill:var(--madera,#c9a77c);stroke:var(--madera-borde,#9c7a50)}
.bola{fill:var(--bola,#ecebe6);stroke:var(--tinta,#1d1d1b);stroke-width:1.5}
.rojo{fill:var(--rojo,#c0392b)}
.srojo{stroke:var(--rojo,#c0392b);stroke-width:2;fill:none}
.s1{stroke:var(--serie1,#2563a8);stroke-width:2;fill:none}
.f1{fill:var(--serie1,#2563a8)}
.s2{stroke:var(--serie2,#b8860b);stroke-width:2;fill:none}
.f2{fill:var(--serie2,#b8860b)}
.sombra1{fill:var(--serie1,#2563a8);opacity:.12}
.sombra2{fill:var(--serie2,#b8860b);opacity:.15}
.sombrar{fill:var(--rojo,#c0392b);opacity:.12}
</style><defs><marker id="fl-maquina-estados" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><rect class="caja" x="10" y="120" width="110" height="50" rx="6"/><text class="t tc tb" x="65.0" y="141.5">Reposo</text><text class="ts tc" x="65.0" y="156.5">al encender</text><rect class="caja" x="180" y="120" width="120" height="50" rx="6"/><text class="t tc tb" x="240.0" y="141.5">Normal</text><text class="ts tc" x="240.0" y="156.5">contando goles</text><rect class="caja" x="370" y="40" width="150" height="50" rx="6"/><text class="t tc tb" x="445.0" y="61.5">Bola de partido</text><text class="ts tc" x="445.0" y="76.5">un equipo con 5</text><rect class="caja" x="370" y="200" width="150" height="50" rx="6"/><text class="t tc tb" x="445.0" y="221.5">LA BUENA</text><text class="ts tc" x="445.0" y="236.5">5 – 5</text><rect class="caja" x="600" y="120" width="150" height="50" rx="6"/><text class="t tc tb" x="675.0" y="141.5">Fin</text><text class="ts tc" x="675.0" y="156.5">ganador · ignora goles</text><line class="l" x1="120" y1="145" x2="178" y2="145" marker-end="url(#fl-maquina-estados)" /><text class="ts tc" x="149" y="137">nueva</text><line class="l" x1="300" y1="135" x2="368" y2="70" marker-end="url(#fl-maquina-estados)" /><text class="ts" x="300" y="92">alguien llega a 5</text><line class="l" x1="445" y1="90" x2="445" y2="198" marker-end="url(#fl-maquina-estados)" /><text class="ts" x="452" y="150">el otro llega a 5</text><line class="l" x1="520" y1="65" x2="598" y2="132" marker-end="url(#fl-maquina-estados)" /><text class="ts" x="560" y="86">6 goles</text><line class="l" x1="520" y1="225" x2="598" y2="160" marker-end="url(#fl-maquina-estados)" /><text class="ts" x="560" y="212">gol decisivo</text><path class="l" d="M675,170 C675,290 240,290 240,172" marker-end="url(#fl-maquina-estados)"/><text class="ts tc" x="460" y="285">nueva partida (desde HA)</text><text class="ts" x="10" y="26">Correcciones (+1 / −1) recalculan el estado desde el marcador. «Anular» vuelve a Reposo.</text><text class="ts" x="10" y="42">Cada cambio de estado activa su preset de WLED y se publica en HA.</text></svg>
