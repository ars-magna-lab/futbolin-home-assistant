<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="Cómo se separa el impacto del gol de los golpes a la mesa"><title>Cómo se separa el impacto del gol de los golpes a la mesa</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
.ls{stroke:var(--suave,#6b6a65);stroke-width:1;fill:none}
.lg{stroke:var(--linea,#e3e1db);stroke-width:1;fill:none}
.caja{fill:var(--papel,#fff);stroke:var(--suave,#6b6a65);stroke-width:1.2}
.zona{fill:var(--chip,#efede8);stroke:var(--linea,#e3e1db)}
.punteada{stroke-dasharray:5 4}
.madera{fill:var(--madera,#c9a77c);stroke:var(--madera-borde,#9c7a50)}
.bola{fill:var(--bola,#ecebe6);stroke:var(--tinta,#1d1d1b);stroke-width:1.5}
.rojo{fill:var(--rojo,#c0392b)}
.srojo{stroke:var(--rojo,#c0392b);stroke-width:2;fill:none}
.s1{stroke:var(--serie1,#2563a8);stroke-width:2;fill:none}
.f1{fill:var(--serie1,#2563a8)}
.s2{stroke:var(--serie2,#b8860b);stroke-width:2;fill:none}
.f2{fill:var(--serie2,#b8860b)}
.sombra1{fill:var(--serie1,#2563a8);opacity:.12}
.sombra2{fill:var(--serie2,#b8860b);opacity:.15}
.sombrar{fill:var(--rojo,#c0392b);opacity:.12}
</style><defs><marker id="fl-piezo-ventana" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><line class="lg" x1="70" y1="190.0" x2="710" y2="190.0"/><text class="ts te" x="64" y="194.0">0</text><line class="lg" x1="70" y1="144.5" x2="710" y2="144.5"/><text class="ts te" x="64" y="148.5">1</text><line class="lg" x1="70" y1="99.1" x2="710" y2="99.1"/><text class="ts te" x="64" y="103.1">2</text><line class="lg" x1="70" y1="53.6" x2="710" y2="53.6"/><text class="ts te" x="64" y="57.6">3</text><text class="ts tc" x="70.0" y="206">0,0</text><text class="ts tc" x="230.0" y="206">0,5</text><text class="ts tc" x="390.0" y="206">1,0</text><text class="ts tc" x="550.0" y="206">1,5</text><text class="ts tc" x="710.0" y="206">2,0</text><line class="ls" x1="70" y1="190" x2="710" y2="190"/><text class="ts tc" x="390.0" y="224">tiempo (s)</text><text class="ts" x="30" y="30">pico (V)</text><rect class="sombra1" x="262.0" y="40" width="320.0" height="150"/><text class="ts tc" x="422.0" y="54">ventana: 1 s antes del gol</text><line class="s1" x1="108.4" y1="190.0" x2="108.4" y2="167.3"/><circle class="f1" cx="108.4" cy="167.3" r="5" style="stroke:var(--papel,#fff);stroke-width:2"><title>0,12 s: 0,5 V (barra)</title></circle><line class="s1" x1="166.0" y1="190.0" x2="166.0" y2="80.9"/><circle class="f1" cx="166.0" cy="80.9" r="5" style="stroke:var(--papel,#fff);stroke-width:2"><title>0,30 s: 2,4 V (golpe a la mesa)</title></circle><line class="s1" x1="246.0" y1="190.0" x2="246.0" y2="171.8"/><circle class="f1" cx="246.0" cy="171.8" r="5" style="stroke:var(--papel,#fff);stroke-width:2"><title>0,55 s: 0,4 V (barra)</title></circle><line class="s1" x1="342.0" y1="190.0" x2="342.0" y2="162.7"/><circle class="f1" cx="342.0" cy="162.7" r="5" style="stroke:var(--papel,#fff);stroke-width:2"><title>0,85 s: 0,6 V (barra)</title></circle><line class="s2" x1="460.4" y1="190.0" x2="460.4" y2="99.1"/><circle class="f2" cx="460.4" cy="99.1" r="5" style="stroke:var(--papel,#fff);stroke-width:2"><title>1,22 s: 2,0 V (impacto en el fondo)</title></circle><line class="s1" x1="518.0" y1="190.0" x2="518.0" y2="174.1"/><circle class="f1" cx="518.0" cy="174.1" r="5" style="stroke:var(--papel,#fff);stroke-width:2"><title>1,40 s: 0,3 V (barra)</title></circle><line class="s1" x1="646.0" y1="190.0" x2="646.0" y2="158.2"/><circle class="f1" cx="646.0" cy="158.2" r="5" style="stroke:var(--papel,#fff);stroke-width:2"><title>1,80 s: 0,7 V (barra)</title></circle><text class="t" x="172.4" y="74.1">golpe fuerte a la mesa: fuera de la ventana, se ignora</text><text class="t tb" x="466.8" y="92.3">máximo en la ventana = impacto</text><line class="srojo" x1="582.0" y1="40" x2="582.0" y2="190"/><text class="t tb" x="588.0" y="54" style="fill:var(--rojo,#c0392b)">GOL (barrera IR)</text><text class="ts" x="70" y="252">Ilustrativo. El ancho real de la ventana es lo que tarda la bola del fondo a la barrera: hay que medirlo.</text></svg>
