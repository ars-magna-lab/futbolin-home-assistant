<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" role="img" aria-label="Conexión de las tiras al Gledopto"><title>Conexión de las tiras al Gledopto</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
.ls{stroke:var(--suave,#6b6a65);stroke-width:1;fill:none}
.lg{stroke:var(--linea,#e3e1db);stroke-width:1;fill:none}
.caja{fill:var(--papel,#fff);stroke:var(--suave,#6b6a65);stroke-width:1.2}
.zona{fill:var(--chip,#efede8);stroke:var(--linea,#e3e1db)}
.punteada{stroke-dasharray:5 4}
.madera{fill:var(--madera,#c9a77c);stroke:var(--madera-borde,#9c7a50)}
.bola{fill:var(--bola,#ecebe6);stroke:var(--tinta,#1d1d1b);stroke-width:1.5}
.rojo{fill:var(--rojo,#c0392b)}
.srojo{stroke:var(--rojo,#c0392b);stroke-width:2;fill:none}
.s1{stroke:var(--serie1,#2563a8);stroke-width:2;fill:none}
.f1{fill:var(--serie1,#2563a8)}
.s2{stroke:var(--serie2,#b8860b);stroke-width:2;fill:none}
.f2{fill:var(--serie2,#b8860b)}
.sombra1{fill:var(--serie1,#2563a8);opacity:.12}
.sombra2{fill:var(--serie2,#b8860b);opacity:.15}
.sombrar{fill:var(--rojo,#c0392b);opacity:.12}
</style><defs><marker id="fl-tiras-conexion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><rect class="caja" x="10" y="96" width="110" height="50" rx="6"/><text class="t tc tb" x="65.0" y="117.5">Bus 12 V</text><text class="ts tc" x="65.0" y="132.5">tras interruptor</text><line class="l" x1="120" y1="121" x2="178" y2="121" marker-end="url(#fl-tiras-conexion)" /><line class="l" x1="150" y1="121" x2="150" y2="150"/><line class="l" x1="138" y1="150" x2="162" y2="150"/><line class="l" x1="138" y1="157" x2="162" y2="157"/><line class="l" x1="150" y1="157" x2="150" y2="176"/><text class="ts tc" x="150" y="192">1000 µF</text><rect class="caja" x="180" y="86" width="150" height="70" rx="6"/><text class="t tc tb" x="255.0" y="110.0">Gledopto · WLED</text><text class="ts tc" x="255.0" y="125.0">2 salidas G D V</text><text class="ts tc" x="255.0" y="140.0">GPIO 16 y GPIO 2</text><polyline class="l" points="330,106 380,106 400,60 428,60" marker-end="url(#fl-tiras-conexion)"/><polyline class="l" points="330,136 380,136 400,182 428,182" marker-end="url(#fl-tiras-conexion)"/><text class="ts tc" x="352" y="98">salida 1</text><text class="ts tc" x="352" y="152">salida 2</text><rect class="caja" x="430" y="30" width="320" height="60" rx="6"/><text class="t tb" x="444" y="50">Tira A · GPIO 16 · píxeles 0–27</text><rect x="448" y="62" width="40" height="18" rx="3" style="fill:var(--chip,#efede8);stroke:var(--suave,#6b6a65)"/><text class="ts tc" x="468" y="75">+12 V</text><rect x="518" y="62" width="40" height="18" rx="3" style="fill:var(--chip,#efede8);stroke:var(--suave,#6b6a65)"/><text class="ts tc" x="538" y="75">DI</text><rect x="588" y="62" width="40" height="18" rx="3" style="fill:var(--chip,#efede8);stroke:var(--suave,#6b6a65)"/><text class="ts tc" x="608" y="75">GND</text><rect class="caja" x="430" y="152" width="320" height="60" rx="6"/><text class="t tb" x="444" y="172">Tira B · GPIO 2 · píxeles 28–55</text><rect x="448" y="184" width="40" height="18" rx="3" style="fill:var(--chip,#efede8);stroke:var(--suave,#6b6a65)"/><text class="ts tc" x="468" y="197">+12 V</text><rect x="518" y="184" width="40" height="18" rx="3" style="fill:var(--chip,#efede8);stroke:var(--suave,#6b6a65)"/><text class="ts tc" x="538" y="197">DI</text><rect x="588" y="184" width="40" height="18" rx="3" style="fill:var(--chip,#efede8);stroke:var(--suave,#6b6a65)"/><text class="ts tc" x="608" y="197">GND</text><text class="ts" x="10" y="232">Cada tira a su salida: dos segmentos en WLED, se manejan por separado.</text></svg>
