l(#fl-alimentacion)" /><rect class="caja" x="645" y="108" width="110" height="48" rx="6"/><text class="t tc tb" x="700.0" y="128.5">ESP32</text><text class="ts tc" x="700.0" y="143.5">+ sensores · 1,5 W</text><line class="l" x1="495" y1="220" x2="518" y2="220" marker-end="url(#fl-alimentacion)" /><rect class="caja" x="520" y="196" width="110" height="48" rx="6"/><text class="t tc tb" x="575.0" y="216.5">Divisor</text><text class="ts tc" x="575.0" y="231.5">100k / 20k</text><line class="l" x1="630" y1="220" x2="643" y2="220" marker-end="url(#fl-alimentacion)" /><rect class="caja" x="645" y="196" width="110" height="48" rx="6"/><text class="t tc tb" x="700.0" y="216.5">ADC GPIO 34</text><text class="ts tc" x="700.0" y="231.5">% de batería</text></svg>
