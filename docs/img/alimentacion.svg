<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="Esquema de alimentación del futbolín"><title>Esquema de alimentación del futbolín</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
