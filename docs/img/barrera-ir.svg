<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" width="760" height="285" role="img" aria-label="Barrera IR en el carril y la señal que recibe el ESP32"><title>Barrera IR en el carril y la señal que recibe el ESP32</title><style>
.t{fill:var(--tinta,#1d1d1b);font:13px system-ui,sans-serif}
.ts{fill:var(--suave,#6b6a65);font:12px system-ui,sans-serif}
.tc{text-anchor:middle}
.te{text-anchor:end}
.tb{font-weight:600}
.l{stroke:var(--tinta,#1d1d1b);stroke-width:1.5;fill:none}
.ls{stroke:var(--suave,#6b6a65);stroke-width:1;fill:none}
.lg{stroke:var(--linea,#e3e1db);stroke-width:1;fill:none}
.caja{fill:var(--papel,#fff);stroke:var(--suave,#6b6a65);stroke-width:1.2}
.zona{fill:var(--chip,#efede8);stroke:var(--linea,#e3e1db)}
.punteada{stroke-dasharray:5 4}
.madera{fill:var(--madera,#c9a77c);stroke:var(--madera-borde,#9c7a50)}
.bola{fill:var(--bola,#ecebe6);stroke:var(--tinta,#1d1d1b);stroke-width:1.5}
.rojo{fill:var(--rojo,#c0392b)}
.srojo{stroke:var(--rojo,#c0392b);stroke-width:2;fill:none}
.s1{stroke:var(--serie1,#2563a8);stroke-width:2;fill:none}
.f1{fill:var(--serie1,#2563a8)}
.s2{stroke:var(--serie2,#b8860b);stroke-width:2;fill:none}
.f2{fill:var(--serie2,#b8860b)}
.sombra1{fill:var(--serie1,#2563a8);opacity:.12}
.sombra2{fill:var(--serie2,#b8860b);opacity:.15}
.sombrar{fill:var(--rojo,#c0392b);opacity:.12}
</style><defs><marker id="fl-barrera-ir" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--tinta,#1d1d1b)"/></marker></defs><text class="t tb" x="40" y="24">Corte del carril, visto de frente</text><rect class="madera" x="40" y="50" width="40" height="160"/><rect class="madera" x="220" y="50" width="40" height="160"/><rect class="madera" x="40" y="210" width="220" height="22"/><rect style="fill:var(--papel,#fff)" x="40" y="153" width="40" height="14"/><rect style="fill:var(--papel,#fff)" x="220" y="153" width="40" height="14"/><rect class="rojo" x="44" y="154" width="28" height="12" rx="3"/><rect style="fill:var(--tinta,#1d1d1b)" x="228" y="154" width="28" height="12" rx="3"/><line class="srojo punteada" x1="72" y1="160" x2="98" y2="160"/><line class="ls punteada" x1="202" y1="160" x2="228" y2="160"/><circle class="bola" cx="150" cy="156" r="54"/><text class="ts tc" style="fill:#4a4944" x="150" y="152">bola maciza</text><text class="ts tc" style="fill:#4a4944" x="150" y="168">≈ 3,5 cm</text><text class="ts" x="20" y="252">emisor IR 940 nm</text><text class="ts" x="20" y="268">(siempre encendido)</text><text class="ts te" x="285" y="252">receptor</text><text class="ts te" x="285" y="268">(fototransistor)</text><line class="ls" x1="88" y1="84" x2="72" y2="152"/><text class="ts" x="86" y="80">retranqueado 2–3 mm</text><text class="t tb" x="340" y="24">Señal en el GPIO 32 (receptor)</text><text class="ts te" x="334" y="84">haz libre</text><text class="ts te" x="334" y="164">tapado</text><line class="lg" x1="340" y1="196" x2="745" y2="196"/><rect class="sombra1" x="438" y="54" width="200" height="132"/><text class="ts" x="548" y="102">bloqueo 400 ms:</text><text class="ts" x="548" y="116">otro corte aquí</text><text class="ts" x="548" y="130">se ignora</text><polyline class="s1" points="340.0,80.0 418.0,80.0 418.0,160.0 438.0,160.0 438.0,80.0 540.0,80.0 540.0,160.0 543.0,160.0 543.0,80.0 745.0,80.0"/><text class="ts tc" x="428" y="214">≈ 35 ms</text><circle class="f2" cx="438" cy="80" r="5"/><text class="t tb" x="438" y="48" text-anchor="middle">GOL</text><text class="ts tc" x="541" y="178">ruido: descartado</text><text class="ts" x="340" y="240">El ESP32 mide cuánto dura el corte por interrupción (resolución de µs).</text><text class="ts" x="340" y="256">Corte &lt; 0,5 ms = ruido · tapado &gt; 2 s = aviso de atasco.</text><text class="ts" x="340" y="272">Autotest al arrancar: apaga el emisor (GPIO 14) y espera ver «tapado».</text></svg>
