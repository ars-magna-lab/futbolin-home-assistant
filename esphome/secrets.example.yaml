# Copia este fichero como secrets.yaml (no se sube al repo) y pon tus valores.

# Red WiFi a la que se conecta el ESP32
wifi_ssid: "MiWiFi"
wifi_password: "cambia-esta-clave"

# Clave del hotspot de rescate («futbolin Fallback Hotspot»), que se abre si
# no consigue conectarse a la WiFi
ap_password: "cambia-esta-clave"

# Clave de cifrado de la API nativa de ESPHome (32 bytes en base64). Genera una
# con:  python3 -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
futbolin_api_key: "cámbiala-por-una-clave-base64-de-32-bytes"

# Contraseña de las actualizaciones por WiFi (OTA)
futbolin_ota: "cambia-esta-clave"

# IP fija del controlador WLED de las tiras (resérvala en el router)
wled_ip: "192.0.2.10"
